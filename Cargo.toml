[workspace]
resolver = "3"
members = ["crates/diskdust-core", "crates/diskdust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
diskdust-core = { path = "crates/diskdust-core" }
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.37.0"
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37.0"
opener = { version = "0.9.0", features = ["reveal"] }
plist = "1.10.4"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trash = "5.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `assert!(v.is_empty())` reads better in tests than `assert_eq!(v, [] as [T; 0])`.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
