name: Release

# Publishing: Actions → Release → "Run workflow" on main with the version from Cargo.toml.
# CI creates the vX.Y.Z tag and the GitHub Release (no manual tags). Pull requests that touch
# packaging run the same builds as a dry run, without publishing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 or v0.1.0 (must equal the workspace version in Cargo.toml)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/diskdust/Cargo.toml
      - assets/**
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PACKAGER_VERSION: 0.11.8

jobs:
  verify:
    name: verify release request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check branch, version, tag and CI status
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}" # accept 0.1.0 and v0.1.0
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main only (got $GITHUB_REF)"; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$VERSION" != "$cargo_version" ]; then
            echo "::error::Version $VERSION does not match Cargo.toml ($cargo_version); bump it in a PR first"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$ci" -lt 1 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA; wait for it or fix main first"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: package (${{ matrix.name }})
    needs: verify
    # Runs after a successful verify (release) or without it (pull-request dry run).
    if: always() && (needs.verify.result == 'success' || github.event_name == 'pull_request')
    strategy:
      # Every platform reports its own result; publish still needs all four.
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64, os: macos-latest, formats: dmg }
          - { name: macos-x86_64, os: macos-15-intel, formats: dmg }
          - { name: linux-x86_64, os: ubuntu-24.04, formats: "deb,appimage" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, formats: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    env:
      # linuxdeploy is itself an AppImage; CI runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain from rust-toolchain.toml. No build cache: release artifacts are built from scratch.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo install cargo-packager --version "$PACKAGER_VERSION" --locked
      # cargo-packager resolves a relative --out-dir against the package directory.
      - run: cargo packager --release --formats "${{ matrix.formats }}" --out-dir "$GITHUB_WORKSPACE/dist"
      - name: Smoke-test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.dmg dist/*.deb dist/*.AppImage)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::cargo-packager produced no packages in dist/"; exit 1
          fi
          ls -la "${packages[@]}"
          ./target/release/diskdust --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskdust-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    needs: [verify, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create tag and release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Install

          **macOS** (Apple Silicon: \`_aarch64.dmg\`, Intel: \`_x64.dmg\`). The build is not notarized yet, so Gatekeeper
          rejects a browser-downloaded disk image. Remove the quarantine first, then open it and drag diskdust to Applications:
          \`xattr -d com.apple.quarantine ~/Downloads/diskdust_${VERSION}_aarch64.dmg\` (or \`_x64.dmg\`).
          See the README for a terminal-only install.

          **Debian / Ubuntu**: \`sudo apt install ./diskdust_${VERSION}_amd64.deb\` (or \`_arm64.deb\`).

          **Other Linux**: \`chmod +x diskdust_${VERSION}_x86_64.AppImage && ./diskdust_${VERSION}_x86_64.AppImage\`
          (or \`_aarch64.AppImage\`).

          **Verify**: \`sha256sum -c SHA256SUMS --ignore-missing\`, and the build provenance with
          \`gh attestation verify <file> --repo ${GH_REPO}\`.
          EOF
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "diskdust $VERSION" \
            --notes-file notes.md \
            --generate-notes
