<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#2b1b4d"/>
      <stop offset="0.55" stop-color="#0d0a16"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="platter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b39ddb"/>
      <stop offset="0.5" stop-color="#7e57c2"/>
      <stop offset="1" stop-color="#4527a0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded tile on Apple's 824px icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#3a2a5e" stroke-width="3"/>

  <!-- Disk platter -->
  <circle cx="470" cy="580" r="250" fill="url(#platter)"/>
  <circle cx="470" cy="580" r="250" fill="url(#sheen)"/>
  <circle cx="470" cy="580" r="182" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="470" cy="580" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>
  <circle cx="470" cy="580" r="54" fill="#0d0a16"/>
  <circle cx="470" cy="580" r="18" fill="#b39ddb"/>

  <!-- Dust lifting off the platter -->
  <circle cx="676" cy="372" r="30" fill="#d1c4e9" fill-opacity="0.95"/>
  <circle cx="752" cy="300" r="22" fill="#d1c4e9" fill-opacity="0.8"/>
